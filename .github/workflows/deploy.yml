name: Deploy PHP ke Hostinger

on:
  push:
    branches: [main]
    paths:
      - "api/**"

jobs:
  deploy-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload PHP ke Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./api/
          server-dir: /public_html/kosha/api/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
